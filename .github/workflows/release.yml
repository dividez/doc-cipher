name: Release Packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to upload assets to, for example v0.1.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  NODE_NO_WARNINGS: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  npm_config_audit: false
  npm_config_fund: false
  CSC_IDENTITY_AUTO_DISCOVERY: false
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            builder_args: --win nsis zip --x64
          - name: macos-x64
            runner: macos-13
            builder_args: --mac dmg zip --x64
          - name: macos-arm64
            runner: macos-latest
            builder_args: --mac dmg zip --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync package version from release tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build packages
        run: pnpm build

      - name: Package installer
        run: pnpm exec electron-builder --config electron-builder.mjs ${{ matrix.builder_args }} --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocCipher-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        run: |
          shopt -s nullglob
          assets=(dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/*.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found in dist"
            exit 1
          fi

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
